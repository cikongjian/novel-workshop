name: 缺陷报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先确认：使用类提问（怎么装、怎么配、怎么用）请发到 [Discussions](https://github.com/cikongjian/novel-workshop/discussions)，这里只处理缺陷。

        安全漏洞请不要发在这里，走 [Security Advisories](https://github.com/cikongjian/novel-workshop/security/advisories/new)。

  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
        - label: 我能在最新的 main 分支上复现
          required: true

  - type: textarea
    attributes:
      label: 问题描述
      description: 实际发生了什么，你期望发生什么
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: 环境信息
      description: |
        请提供以下内容。缺少环境信息的 issue 无法定位，会被直接关闭。
      value: |
        - 操作系统：
        - Node.js 版本（`node -v`）：
        - 部署方式：源码 / Docker
        - 模型供应商与模型名：
        - Embedding 是否配置：
        - AUTH_ENABLED：
        - 浏览器（前端问题时）：
    validations:
      required: true

  - type: textarea
    attributes:
      label: 日志与报错
      description: |
        后端控制台输出、浏览器 Console 报错。
        **贴之前请自行删掉 API Key、token、密码等敏感信息。**
      render: shell
